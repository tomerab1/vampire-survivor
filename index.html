<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zombie Survivor — Jev Horde</title>
  <style>
    html, body { margin: 0; height: 100%; background: #121412; overflow: hidden; }
    #game { display: block; width: 100%; height: 100%; outline: none; }
    #loading { position: fixed; inset: 0; display: grid; place-items: center; color: #e9e4da;
               font: 600 18px/1.4 system-ui, sans-serif; letter-spacing: .08em; pointer-events: none; }
  </style>
</head>
<body>
  <div id="loading">LOADING THE HORDE…</div>
  <canvas id="game" tabindex="0"></canvas>
  <script>
    // Browsers start an AudioContext created before any user gesture in the "suspended" state,
    // and Bevy creates its context at startup. Track every context and resume them on the
    // first click / key / touch so sound works on fresh origins (e.g. GitHub Pages).
    (() => {
      const Base = window.AudioContext || window.webkitAudioContext;
      if (!Base) return;
      const contexts = (window.__audioContexts = []);
      class TrackedAudioContext extends Base {
        constructor(...args) {
          super(...args);
          contexts.push(this);
        }
      }
      window.AudioContext = TrackedAudioContext;
      window.webkitAudioContext = TrackedAudioContext;
      const resume = () => contexts.forEach((c) => c.state !== "running" && c.resume());
      for (const type of ["pointerdown", "keydown", "touchstart"]) {
        document.addEventListener(type, resume, { capture: true });
      }
    })();
  </script>
  <script type="module">
    import init from "./zombie-survivor.js";
    const canvas = document.getElementById("game");
    canvas.focus();
    canvas.addEventListener("pointerdown", () => canvas.focus());
    init().catch((e) => {
      // wasm-bindgen uses an exception to hand control to winit's event loop.
      if (!String(e).includes("Using exceptions for control flow")) throw e;
    }).finally(() => document.getElementById("loading").remove());
  </script>
</body>
</html>
