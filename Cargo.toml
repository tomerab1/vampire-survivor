[package]
name = "zombie-survivor"
version = "0.1.0"
edition = "2024"
description = "Top-down zombie survival in Bevy, with the horde directed by Jev (TypeSafe System One)"
license = "MIT"

[workspace]
members = ["serve"]

[dependencies]
bevy = { version = "0.19.1", default-features = false, features = ["2d", "ui", "audio"] }
ehttp = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Location"] }
js-sys = "0.3"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.wasm-release]
inherits = "release"
opt-level = "z"
strip = true
